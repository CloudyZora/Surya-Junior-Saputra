<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surya Junior Saputra — Minimalist Portfolio</title>
    <meta
      name="description"
      content="Portofolio web minimalis, cepat, dan mudah disesuaikan (adjustable) untuk karya Desain Karakter 2D & Animasi 3D Surya Junior Saputra."
    />
    <meta property="og:title" content="Surya Junior Saputra — Minimalist Portfolio" />
    <meta
      property="og:description"
      content="Portofolio web minimalis, cepat, dan mudah disesuaikan (adjustable) untuk karya Desain Karakter 2D & Animasi 3D Surya Junior Saputra."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__PORTFOLIO_MOUNTED__ && location.hostname.indexOf('github.io') !== -1) {
            var root = document.getElementById('root');
            if (root && !root.innerHTML.trim()) {
              root.innerHTML =
                '<div style="max-width:560px;margin:80px auto;padding:28px;font-family:system-ui,sans-serif;color:#141413;background:#f9f8f4;border:1px solid rgba(20,20,19,0.14);border-radius:16px;line-height:1.6">' +
                '<h1 style="font-size:20px;margin:0 0 8px 0">Pengaturan GitHub Pages Perlu Diubah ke GitHub Actions</h1>' +
                '<p style="font-size:14px;margin:0 0 12px 0;color:#52514c">Saat ini GitHub Pages masih menampilkan kode mentah (.tsx) dari cabang secara langsung sehingga aplikasi React belum terkompilasi.</p>' +
                '<ol style="font-size:14px;margin:0;padding-left:20px;color:#141413">' +
                '<li>Buka repositori GitHub Anda lalu klik tab <b>Settings</b> &rarr; <b>Pages</b>.</li>' +
                '<li>Pada bagian <b>Build and deployment &rarr; Source</b>, ubah dari <i>Deploy from a branch</i> menjadi <b>GitHub Actions</b>.</li>' +
                '<li>Tunggu sekitar 1 menit hingga proses <i>Actions</i> selesai, lalu muat ulang halaman ini.</li>' +
                '</ol>' +
                '</div>';
            }
          }
        }, 1800);
      });
    </script>
  </body>
</html>
